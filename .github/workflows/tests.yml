name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v

      - name: Clean log must pass the regression gate
        run: python scripts/analyze_logs.py data/clean.log --fail-on-spike --report clean_report.md

      - name: Analyze the incident log and write the report
        run: python scripts/analyze_logs.py data/incident.log

      - name: Upload incident report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: incident-report
          path: docs/incident_report.md
